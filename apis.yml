name: dwell
description: >-
  Dwell is a digital publication and lifestyle brand focused on modern home
  design, architecture, and interior inspiration, published by Ziff Davis. It
  offers curated home tours, architectural features, renovation and before/after
  projects, design photography, real estate listings, shopping guides, and
  design news, plus a Dwell+ subscription for ad-free access and subscriber
  exclusives, a shop for furniture and decor, and a "Find a Pro" professional
  directory. Dwell was surfaced as a portfolio-adjacent lead in the API
  Evangelist network; the public dwell.com property is a consumer media site
  with no developer API, SDK, or developer portal, so no API artifacts are
  captured for it.
